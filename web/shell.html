<title>Siege Evolution</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<style>
/* The loading screen is laid out in the game's own units (the game is
   360x640 and scales to fit the window's width, like Godot's keep_width),
   so its title sits exactly where the title menu draws it: no jump when
   the game takes over. */
:root {
	--bg: #140c12;          /* the game's background */
	--cell: #2a1622;        /* empty loading-bar cells */
	--heart: #ff4d6d;       /* filled cells, EVOLUTION */
	--ink: #f3e3ea;
	--ink-dim: #b79aa8;
	--title: "SiegeTitle", ui-rounded, system-ui, sans-serif;   /* the game's fonts, */
	--body: "SiegeText", ui-monospace, monospace;               /* embedded below */
	--u: min(calc(100vw / 360), calc(100vh / 640));   /* one game pixel */
	color-scheme: dark;
}
html, body { height: 100%; }
body {
	margin: 0;
	background: var(--bg);
	color: var(--ink);
	overflow: hidden;
	touch-action: none;
	font-family: var(--body);
}
#canvas { display: block; width: 100%; height: 100%; }
#canvas:focus { outline: none; }
#status { position: fixed; inset: 0; background: var(--bg); }
#stage {
	position: absolute;
	top: 0;
	left: 50%;
	width: calc(360 * var(--u));
	height: calc(640 * var(--u));
	transform: translateX(-50%);
	text-align: center;
}
#stage > * { position: absolute; left: 0; right: 0; margin: 0; }
#siege, #evolution { font-family: var(--title); font-weight: 400; line-height: 1; }
#siege { top: calc(139.8 * var(--u)); font-size: calc(54 * var(--u)); color: var(--ink); }
#evolution { top: calc(198.8 * var(--u)); font-size: calc(30 * var(--u)); color: var(--heart); }
#tagline { top: calc(240.4 * var(--u)); font-size: calc(14 * var(--u)); color: var(--ink-dim); }

/* A parade of invaders, one from each world, marching across. */
#parade { top: calc(300 * var(--u)); height: calc(48 * var(--u)); overflow: hidden; }
#parade i {
	position: absolute;
	bottom: 0;
	left: 0;
	width: calc(40 * var(--u));
	height: calc(40 * var(--u));
	overflow: hidden;
	/* The same thin red ring enemies wear in the game. */
	filter: drop-shadow(calc(var(--u)) 0 0 #e8323c) drop-shadow(calc(-1 * var(--u)) 0 0 #e8323c)
		drop-shadow(0 calc(var(--u)) 0 #e8323c) drop-shadow(0 calc(-1 * var(--u)) 0 #e8323c);
	transform: translateX(calc(-48 * var(--u)));
}
/* Each sprite is a strip of frames that slides along inside its box.
   Sliding (a transform) keeps animating even while the page is busy
   starting the game; swapping images would freeze. */
#parade b, #units b {
	position: absolute;
	inset: 0 auto 0 0;
	height: 100%;
	background-size: 100% 100%;
	image-rendering: pixelated;
}
#parade b { width: 400%; }
#ground { top: calc(348 * var(--u)); height: calc(2 * var(--u)); background: var(--cell); }

/* Units standing under the track, shooting at the parade. */
#units { top: calc(358 * var(--u)); height: calc(40 * var(--u)); }
#units i {
	position: absolute;
	top: 0;
	width: calc(40 * var(--u));
	height: calc(40 * var(--u));
	overflow: hidden;
	/* No pads here: those are only for units on the game board. */
}
#units b { width: 200%; }
#units i.firing b { width: 300%; }
.shot {
	position: absolute;
	width: calc(5 * var(--u));
	height: calc(5 * var(--u));
	border-radius: 50%;
	box-shadow: 0 0 calc(4 * var(--u)) currentColor;
	background: currentColor;
	pointer-events: none;
}
#parade i.hit { filter: brightness(3) drop-shadow(calc(var(--u)) 0 0 #e8323c); }
#parade i.gone { visibility: hidden; }

#bar {
	top: calc(414 * var(--u));
	display: grid;
	grid-template-columns: repeat(14, calc(14 * var(--u)));
	gap: calc(3 * var(--u));
	justify-content: center;
}
#bar i { height: calc(14 * var(--u)); background: var(--cell); }
#bar i.on { background: var(--heart); }
#percent { top: calc(438 * var(--u)); font-size: calc(12 * var(--u)); color: var(--ink-dim); }
#notice {
	top: calc(464 * var(--u));
	padding-inline: calc(24 * var(--u));
	display: none;
	font-size: calc(13 * var(--u));
	line-height: 1.4;
	color: var(--heart);
	white-space: pre-line;
}
@media (prefers-reduced-motion: no-preference) {
	#bar i.on { transition: background 120ms linear; }
	#parade i { animation: march 9s linear infinite; }
	#parade b { animation: frames4 0.6s steps(4) infinite; }
	#parade i.dead b { animation: frames4 0.5s steps(4) forwards; }
	#units b { animation: frames2 0.8s steps(2) infinite; }
	#units i.firing b { animation: frames3 0.33s steps(3); }
	/* EVOLUTION cycles through the world colors, like the title menu. */
	#evolution { animation: worlds 12.6s linear infinite; }
	/* "Starting..." breathes while the game boots. */
	#percent.starting { animation: breathe 1.2s ease-in-out infinite; }
}
@keyframes frames4 { to { transform: translateX(-100%); } }
@keyframes frames3 { to { transform: translateX(-100%); } }
@keyframes frames2 { to { transform: translateX(-100%); } }
@keyframes breathe { 50% { opacity: 0.35; } }
@keyframes worlds {
	0% { color: #ff7ac8; } 3.17% { color: #ff5a7a; }
	14.29% { color: #ff5a7a; } 17.46% { color: #8fd04a; }
	28.57% { color: #8fd04a; } 31.75% { color: #e8a03a; }
	42.86% { color: #e8a03a; } 46.03% { color: #6fb3e8; }
	57.14% { color: #6fb3e8; } 60.32% { color: #b07aff; }
	71.43% { color: #b07aff; } 74.60% { color: #5ad1b8; }
	85.71% { color: #5ad1b8; } 88.89% { color: #ff7ac8; }
	100% { color: #ff7ac8; }
}
@keyframes march {
	from { transform: translateX(calc(-48 * var(--u))); }
	to { transform: translateX(calc(400 * var(--u))); }
}

<script>
// The web host only serves a fixed set of file types, so the engine
// (index.wasm, gzipped) and game data (index.pck) ship as base64 text files.
// When Godot asks for the originals, a background worker downloads and
// decodes them, so the loading animation never freezes (decoding ~27 MB on
// the page itself froze phones for seconds). It also reports download
// progress, which Godot can't see through the decoding.
(function () {
	var nativeFetch = window.fetch;
	var packed = { 'index.wasm': 'index.wasm.gz.b64.txt', 'index.pck': 'index.pck.b64.txt' };
	// The packed files' sizes, filled in by tools/export_web.sh so the bar
	// knows the total from the start (the host may not send a size).
	var sizes = {};
	try { sizes = JSON.parse('__PACKED_SIZES__'); } catch (e) { sizes = {}; }
	var loaded = {};
	window.packedProgress = function () {
		var done = 0, total = 0;
		Object.keys(packed).forEach(function (name) {
			done += loaded[name] || 0;
			total += sizes[name] || 0;
		});
		return total > 0 ? Math.min(1, done / total) : -1;  // -1 = unknown
	};

	// The worker: fetch a packed file, report bytes as they arrive, then
	// decode the base64 (and un-gzip) and hand back the finished bytes.
	var workerCode = function () {
		self.onmessage = function (event) {
			var job = event.data;
			fetch(job.url).then(function (response) {
				if (!response.ok) { self.postMessage({ id: job.id, missing: true }); return; }
				self.postMessage({ id: job.id, size: Number(response.headers.get('Content-Length')) || 0 });
				var reader = response.body.getReader();
				var chunks = [];
				var count = 0;
				function pump() {
					return reader.read().then(function (part) {
						if (part.done) return;
						chunks.push(part.value);
						count += part.value.length;
						self.postMessage({ id: job.id, loaded: count });
						return pump();
					});
				}
				return pump().then(function () {
					var text = new TextDecoder().decode(join(chunks, count)).replace(/\s/g, '');
					var binary = atob(text);
					var bytes = new Uint8Array(binary.length);
					for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
					if (bytes[0] === 31 && bytes[1] === 139) {  // gzipped: unzip here too
						return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')))
							.arrayBuffer().then(function (buffer) { return new Uint8Array(buffer); });
					}
					return bytes;
				}).then(function (bytes) {
					// The engine (wasm) is also compiled here: compiling ~30 MB on
					// the page froze it for seconds on phones.
					var compiled = job.wasm && self.WebAssembly ? WebAssembly.compile(bytes).catch(function () { return null; })
						: Promise.resolve(null);
					return compiled.then(function (module) {
						self.postMessage({ id: job.id, bytes: bytes, module: module }, [bytes.buffer]);
					});
				});
			}).catch(function (err) { self.postMessage({ id: job.id, error: String(err) }); });
		};
		function join(chunks, count) {
			var all = new Uint8Array(count);
			var at = 0;
			chunks.forEach(function (c) { all.set(c, at); at += c.length; });
			return all;
		}
	};
	var worker = null;
	try {
		worker = new Worker(URL.createObjectURL(new Blob(['(' + workerCode + ')()'], { type: 'text/javascript' })));
	} catch (e) { worker = null; }
	var jobs = {};
	var nextId = 0;
	var compiledEngine = null;
	if (worker) {
		worker.onmessage = function (event) {
			var msg = event.data;
			var job = jobs[msg.id];
			if (!job) return;
			if (msg.size && !sizes[job.name]) sizes[job.name] = msg.size;
			if (msg.loaded !== undefined) {
				loaded[job.name] = msg.loaded;
				if (window.onPackedProgress) window.onPackedProgress();
			}
			if (msg.missing) { delete jobs[msg.id]; job.resolve(nativeFetch(job.original, job.options)); }
			if (msg.error) { delete jobs[msg.id]; job.reject(new Error(msg.error)); }
			if (msg.bytes) {
				delete jobs[msg.id];
				var type = job.name === 'index.wasm' ? 'application/wasm' : 'application/octet-stream';
				if (msg.module) compiledEngine = msg.module;  // the engine, already compiled
				job.resolve(new Response(msg.bytes, { headers: { 'Content-Type': type } }));
			}
		};
	}
	window.fetch = function (url, options) {
		var s = String((url && url.url) || url);
		var name = Object.keys(packed).find(function (n) { return s.split('?')[0].endsWith(n); });
		if (!name || !worker) return nativeFetch.apply(this, arguments);
		var target = new URL(s.replace(name, packed[name]), document.baseURI).href;
		return new Promise(function (resolve, reject) {
			var id = nextId++;
			jobs[id] = { name: name, original: s, options: options, resolve: resolve, reject: reject };
			worker.postMessage({ id: id, url: target, wasm: name === 'index.wasm' });
		});
	};
	// When Godot compiles the engine, reuse the module the worker compiled.
	// (Godot re-wraps the download first, so the module is kept here.)
	var nativeStreaming = WebAssembly.instantiateStreaming;
	WebAssembly.instantiateStreaming = function (source, imports) {
		var module = compiledEngine;
		if (!module) return nativeStreaming.call(WebAssembly, source, imports);
		compiledEngine = null;
		return WebAssembly.instantiate(module, imports).then(function (instance) {
			return { instance: instance, module: module };
		});
	};
})();

	const marchers = ['inv-0', 'inv-1', 'inv-2', 'inv-3', 'inv-4', 'inv-5'];

		unit.appendChild(document.createElement('b'));  // the frame strip

		el.addEventListener('animationiteration', function (event) {
			if (event.animationName === 'march') {  // back at the start: alive again
				el.classList.remove('dead', 'gone');
				invader.hp = HITS;
			}
		});
		const invader = { el: el, hp: HITS };
		return invader;
	});
	function centerOf(el) {
		const box = el.getBoundingClientRect();
		const area = stage.getBoundingClientRect();
		return { x: box.left - area.left + box.width / 2, y: box.top - area.top + box.height / 2 };
	}
	function shoot(unit, invader) {
		unit.el.classList.remove('firing');
		void unit.el.offsetWidth;  // restart the attack animation
		unit.el.classList.add('firing');
		setTimeout(function () { unit.el.classList.remove('firing'); }, 320);
		const from = centerOf(unit.el);
		from.y -= unit.el.offsetHeight * 0.3;
		const to = centerOf(invader.el);
		const shot = stage.appendChild(document.createElement('b'));
		shot.className = 'shot';
		shot.style.color = getComputedStyle(unit.el).getPropertyValue('--pack');
		const half = shot.offsetWidth / 2;
		shot.animate([
			{ transform: 'translate(' + (from.x - half) + 'px,' + (from.y - half) + 'px)' },
			{ transform: 'translate(' + (to.x - half) + 'px,' + (to.y - half) + 'px)' },
		], { duration: 180, easing: 'linear' }).onfinish = function () {
			shot.remove();
			if (invader.hp <= 0) return;
			invader.hp -= 1;
			invader.el.classList.add('hit');
			setTimeout(function () { invader.el.classList.remove('hit'); }, 90);
			if (invader.hp === 0) {
				invader.el.classList.add('dead');
				setTimeout(function () { if (invader.hp === 0) invader.el.classList.add('gone'); }, 520);
			}
		};
	}
	const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
	let last = performance.now();
	function tick(now) {
		if (!document.body.contains(stage)) return;  // the game has started
		const delta = (now - last) / 1000;
		last = now;
		const unitSize = units[0].el.offsetWidth;
		units.forEach(function (unit) {
			unit.cooldown -= delta;
			if (unit.cooldown > 0) return;
			const ux = centerOf(unit.el).x;
			const target = invaders.find(function (invader) {
				return invader.hp > 0 && Math.abs(centerOf(invader.el).x - ux) < unitSize * 1.6;
			});
			if (target) {
				shoot(unit, target);
				unit.cooldown = 1.0 + Math.random() * 0.6;
			}
		});
		requestAnimationFrame(tick);
	}
	if (!calm) requestAnimationFrame(tick);

	// Fills the bar. Shows the packed download's progress when there is one
	// (the Claude artifact build), otherwise Godot's own (the itch.io build).
	let godotShare = 0;
	function show() {
		const packedShare = window.packedProgress();
		const share = Math.max(packedShare, godotShare, 0);
		const lit = Math.round(share * cells.length);
		cells.forEach(function (c, i) { c.classList.toggle('on', i < lit); });
		bar.setAttribute('aria-valuenow', Math.round(share * 100));
		percent.textContent = share >= 1 ? 'Starting...' : 'Loading ' + Math.round(share * 100) + '%';
		percent.classList.toggle('starting', share >= 1);
	}
	window.onPackedProgress = show;

	function fail(err) {
		console.error(err);
		notice.textContent = 'The game could not start.\n' + (err && err.message ? err.message : String(err));
		notice.style.display = 'block';
		bar.hidden = true;
		percent.hidden = true;
	}

	const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
	if (missing.length) {
		fail(new Error('This browser is missing: ' + missing.join(', ')));
		return;
	}
	// Browsers ignore the project's portrait setting, so ask for portrait
	// whenever the game goes fullscreen (Android honors this; iOS can't).
	document.addEventListener('fullscreenchange', function () {
		if (document.fullscreenElement && screen.orientation && screen.orientation.lock) {
			screen.orientation.lock('portrait').catch(function () {});
		}
	});
	engine.startGame({
		onProgress: function (current, total) {
			if (total > 0) godotShare = current / total;
			show();
		},
	}).then(function () { status.remove(); }, fail);
})();
</script>
