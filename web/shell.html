<title>Siege Evolution</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<style>
/* The loading screen is laid out in the game's own units (the game is
   360x640 and scales to fit the window's width, like Godot's keep_width),
   so its title sits exactly where the title menu draws it: no jump when
   the game takes over. */
:root {
	--bg: #140c12;          /* the game's background */
	--cell: #2a1622;        /* empty loading-bar cells */
	--heart: #ff4d6d;       /* filled cells, EVOLUTION */
	--ink: #f3e3ea;
	--ink-dim: #b79aa8;
	--title: "SiegeTitle", ui-rounded, system-ui, sans-serif;   /* the game's fonts, */
	--body: "SiegeText", ui-monospace, monospace;               /* embedded below */
	--u: min(calc(100vw / 360), calc(100vh / 640));   /* one game pixel */
	color-scheme: dark;
}
html, body { height: 100%; }
body {
	margin: 0;
	background: var(--bg);
	color: var(--ink);
	overflow: hidden;
	touch-action: none;
	font-family: var(--body);
}
#canvas { display: block; width: 100%; height: 100%; }
#canvas:focus { outline: none; }
#status { position: fixed; inset: 0; background: var(--bg); }
#stage {
	position: absolute;
	top: 0;
	left: 50%;
	width: calc(360 * var(--u));
	height: calc(640 * var(--u));
	transform: translateX(-50%);
	text-align: center;
}
#stage > * { position: absolute; left: 0; right: 0; margin: 0; }
#siege, #evolution { font-family: var(--title); font-weight: 400; line-height: 1; }
#siege { top: calc(139.8 * var(--u)); font-size: calc(54 * var(--u)); color: var(--ink); }
#evolution { top: calc(198.8 * var(--u)); font-size: calc(30 * var(--u)); color: var(--heart); }
#tagline { top: calc(240.4 * var(--u)); font-size: calc(14 * var(--u)); color: var(--ink-dim); }

/* A parade of invaders, one from each world, marching across. */
#parade { top: calc(300 * var(--u)); height: calc(48 * var(--u)); overflow: hidden; }
#parade i {
	position: absolute;
	bottom: 0;
	left: 0;
	width: calc(40 * var(--u));
	height: calc(40 * var(--u));
	background-size: 400% 100%;
	image-rendering: pixelated;
	/* The same thin red ring enemies wear in the game. */
	filter: drop-shadow(calc(var(--u)) 0 0 #e8323c) drop-shadow(calc(-1 * var(--u)) 0 0 #e8323c)
		drop-shadow(0 calc(var(--u)) 0 #e8323c) drop-shadow(0 calc(-1 * var(--u)) 0 #e8323c);
	transform: translateX(calc(-48 * var(--u)));
}
#ground { top: calc(348 * var(--u)); height: calc(2 * var(--u)); background: var(--cell); }

/* Units standing under the track, shooting at the parade. */
#units { top: calc(358 * var(--u)); height: calc(40 * var(--u)); }
#units i {
	position: absolute;
	top: 0;
	width: calc(40 * var(--u));
	height: calc(40 * var(--u));
	background-size: 200% 100%;
	image-rendering: pixelated;
	/* A pad tinted with the unit's pack color, as in the game. */
	box-shadow: inset 0 0 0 calc(var(--u)) color-mix(in srgb, var(--pack) 60%, transparent);
	background-color: color-mix(in srgb, var(--pack) 15%, rgba(0, 0, 0, 0.18));
}
#units i.firing { background-size: 300% 100%; }
.shot {
	position: absolute;
	width: calc(5 * var(--u));
	height: calc(5 * var(--u));
	border-radius: 50%;
	box-shadow: 0 0 calc(4 * var(--u)) currentColor;
	background: currentColor;
	pointer-events: none;
}
#parade i.hit { filter: brightness(3) drop-shadow(calc(var(--u)) 0 0 #e8323c); }
#parade i.gone { visibility: hidden; }

#bar {
	top: calc(414 * var(--u));
	display: grid;
	grid-template-columns: repeat(14, calc(14 * var(--u)));
	gap: calc(3 * var(--u));
	justify-content: center;
}
#bar i { height: calc(14 * var(--u)); background: var(--cell); }
#bar i.on { background: var(--heart); }
#percent { top: calc(438 * var(--u)); font-size: calc(12 * var(--u)); color: var(--ink-dim); }
#notice {
	top: calc(464 * var(--u));
	padding-inline: calc(24 * var(--u));
	display: none;
	font-size: calc(13 * var(--u));
	line-height: 1.4;
	color: var(--heart);
	white-space: pre-line;
}
@media (prefers-reduced-motion: no-preference) {
	#bar i.on { transition: background 120ms linear; }
	#parade i { animation: walk 0.6s steps(4) infinite, march 9s linear infinite; }
	#parade i.dead { animation: die 0.5s steps(4) forwards, march 9s linear infinite; }
	#units i { animation: idle 0.8s steps(2) infinite; }
	#units i.firing { animation: fire 0.3s steps(3) forwards; }
	/* EVOLUTION cycles through the world colors, like the title menu. */
	#evolution { animation: worlds 12.6s linear infinite; }
}
@keyframes walk { to { background-position: 133.333% 0; } }
@keyframes die { to { background-position: 133.333% 0; } }
@keyframes idle { to { background-position: 200% 0; } }
@keyframes fire { to { background-position: 150% 0; } }
@keyframes worlds {
	0% { color: #ff7ac8; } 3.17% { color: #ff5a7a; }
	14.29% { color: #ff5a7a; } 17.46% { color: #8fd04a; }
	28.57% { color: #8fd04a; } 31.75% { color: #e8a03a; }
	42.86% { color: #e8a03a; } 46.03% { color: #6fb3e8; }
	57.14% { color: #6fb3e8; } 60.32% { color: #b07aff; }
	71.43% { color: #b07aff; } 74.60% { color: #5ad1b8; }
	85.71% { color: #5ad1b8; } 88.89% { color: #ff7ac8; }
	100% { color: #ff7ac8; }
}
@keyframes march {
	from { transform: translateX(calc(-48 * var(--u))); }
	to { transform: translateX(calc(400 * var(--u))); }
}

<script>
// The web host only serves a fixed set of file types, so the engine
// (index.wasm, gzipped) and game data (index.pck) ship as base64 text files.
// This decodes them in the browser when Godot asks for the originals, and
// reports download progress (Godot can't see it through the decoding).
(function () {
	var nativeFetch = window.fetch;
	var packed = { 'index.wasm': 'index.wasm.gz.b64.txt', 'index.pck': 'index.pck.b64.txt' };
	// The packed files' sizes, filled in by tools/export_web.sh so the bar
	// knows the total from the start (the host may not send a size).
	var sizes = {};
	try { sizes = JSON.parse('__PACKED_SIZES__'); } catch (e) { sizes = {}; }
	var loaded = {};
	window.packedProgress = function () {
		var done = 0, total = 0;
		Object.keys(packed).forEach(function (name) {
			done += loaded[name] || 0;
			total += sizes[name] || 0;
		});
		return total > 0 ? Math.min(1, done / total) : -1;  // -1 = unknown
	};
	function decode(text) {
		var bin = atob(text.replace(/\s/g, ''));
		var bytes = new Uint8Array(bin.length);
		for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
		return bytes;
	}
	// Reads a response bit by bit, counting bytes for the progress bar.
	function readCounting(response, name) {
		var reader = response.body.getReader();
		var chunks = [];
		loaded[name] = 0;
		function pump() {
			return reader.read().then(function (part) {
				if (part.done) return;
				chunks.push(part.value);
				loaded[name] += part.value.length;
				if (window.onPackedProgress) window.onPackedProgress();
				return pump();
			});
		}
		return pump().then(function () {
			var all = new Uint8Array(loaded[name]);
			var at = 0;
			chunks.forEach(function (c) { all.set(c, at); at += c.length; });
			return new TextDecoder().decode(all);
		});
	}
	window.fetch = function (url, options) {
		var s = String((url && url.url) || url);
		var name = Object.keys(packed).find(function (n) { return s.split('?')[0].endsWith(n); });
		if (!name) return nativeFetch.apply(this, arguments);
		return nativeFetch(s.replace(name, packed[name]), options).then(function (r) {
			if (!r.ok) return nativeFetch(s, options);  // a normal export (itch.io)
			if (!sizes[name]) sizes[name] = Number(r.headers.get('Content-Length')) || 0;
			return readCounting(r, name).then(function (text) {
				var bytes = decode(text);
				var gzipped = bytes[0] === 31 && bytes[1] === 139;
				var body = gzipped ? new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')) : bytes;
				var type = name === 'index.wasm' ? 'application/wasm' : 'application/octet-stream';
				return new Response(body, { headers: { 'Content-Type': type } });
			});
		});
	};
})();
</script>

<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const engine = new Engine(GODOT_CONFIG);
(function () {
	const status = document.getElementById('status');
	const bar = document.getElementById('bar');
	const percent = document.getElementById('percent');
	const notice = document.getElementById('notice');
	const cells = [];
	for (let i = 0; i < 14; i++) { cells.push(bar.appendChild(document.createElement('i'))); }

	// The invaders in the parade, spaced out so one is always on screen.
	const parade = document.getElementById('parade');
	const marchers = ['inv-0', 'inv-1', 'inv-2', 'inv-3', 'inv-4', 'inv-5'];
	marchers.forEach(function (name, i) {
		const invader = parade.appendChild(document.createElement('i'));
		invader.className = name;
		invader.style.animationDelay = (-i * 0.13) + 's, ' + (-i * 1.5) + 's';
	});

	// Units under the track shoot at passing invaders. Five hits and an
	// invader plays its death animation, then comes back on its next lap.
	const stage = document.getElementById('stage');
	const unitRow = document.getElementById('units');
	const UNIT_X = [24, 92, 160, 228, 296];  // game units from the left
	const HITS = 5;
	const units = UNIT_X.map(function (x, i) {
		const unit = unitRow.appendChild(document.createElement('i'));
		unit.className = 'unit-' + i;
		unit.style.left = 'calc(' + x + ' * var(--u))';
		return { el: unit, cooldown: 0.6 + i * 0.35 };
	});
	const invaders = Array.from(parade.children).map(function (el) {
		el.addEventListener('animationiteration', function (event) {
			if (event.animationName === 'march') {  // back at the start: alive again
				el.classList.remove('dead', 'gone');
				invader.hp = HITS;
			}
		});
		const invader = { el: el, hp: HITS };
		return invader;
	});
	function centerOf(el) {
		const box = el.getBoundingClientRect();
		const area = stage.getBoundingClientRect();
		return { x: box.left - area.left + box.width / 2, y: box.top - area.top + box.height / 2 };
	}
	function shoot(unit, invader) {
		unit.el.classList.remove('firing');
		void unit.el.offsetWidth;  // restart the attack animation
		unit.el.classList.add('firing');
		setTimeout(function () { unit.el.classList.remove('firing'); }, 320);
		const from = centerOf(unit.el);
		from.y -= unit.el.offsetHeight * 0.3;
		const to = centerOf(invader.el);
		const shot = stage.appendChild(document.createElement('b'));
		shot.className = 'shot';
		shot.style.color = getComputedStyle(unit.el).getPropertyValue('--pack');
		const half = shot.offsetWidth / 2;
		shot.animate([
			{ transform: 'translate(' + (from.x - half) + 'px,' + (from.y - half) + 'px)' },
			{ transform: 'translate(' + (to.x - half) + 'px,' + (to.y - half) + 'px)' },
		], { duration: 180, easing: 'linear' }).onfinish = function () {
			shot.remove();
			if (invader.hp <= 0) return;
			invader.hp -= 1;
			invader.el.classList.add('hit');
			setTimeout(function () { invader.el.classList.remove('hit'); }, 90);
			if (invader.hp === 0) {
				invader.el.classList.add('dead');
				setTimeout(function () { if (invader.hp === 0) invader.el.classList.add('gone'); }, 520);
			}
		};
	}
	const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
	let last = performance.now();
	function tick(now) {
		if (!document.body.contains(stage)) return;  // the game has started
		const delta = (now - last) / 1000;
		last = now;
		const unitSize = units[0].el.offsetWidth;
		units.forEach(function (unit) {
			unit.cooldown -= delta;
			if (unit.cooldown > 0) return;
			const ux = centerOf(unit.el).x;
			const target = invaders.find(function (invader) {
				return invader.hp > 0 && Math.abs(centerOf(invader.el).x - ux) < unitSize * 1.6;
			});
			if (target) {
				shoot(unit, target);
				unit.cooldown = 1.0 + Math.random() * 0.6;
			}
		});
		requestAnimationFrame(tick);
	}
	if (!calm) requestAnimationFrame(tick);

	// Fills the bar. Shows the packed download's progress when there is one
	// (the Claude artifact build), otherwise Godot's own (the itch.io build).
	let godotShare = 0;
	function show() {
		const packedShare = window.packedProgress();
		const share = Math.max(packedShare, godotShare, 0);
		const lit = Math.round(share * cells.length);
		cells.forEach(function (c, i) { c.classList.toggle('on', i < lit); });
		bar.setAttribute('aria-valuenow', Math.round(share * 100));
		percent.textContent = share >= 1 ? 'Starting...' : 'Loading ' + Math.round(share * 100) + '%';
	}
	window.onPackedProgress = show;

	function fail(err) {
		console.error(err);
		notice.textContent = 'The game could not start.\n' + (err && err.message ? err.message : String(err));
		notice.style.display = 'block';
		bar.hidden = true;
		percent.hidden = true;
	}

	const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
	if (missing.length) {
		fail(new Error('This browser is missing: ' + missing.join(', ')));
		return;
	}
	// Browsers ignore the project's portrait setting, so ask for portrait
	// whenever the game goes fullscreen (Android honors this; iOS can't).
	document.addEventListener('fullscreenchange', function () {
		if (document.fullscreenElement && screen.orientation && screen.orientation.lock) {
			screen.orientation.lock('portrait').catch(function () {});
		}
	});
	engine.startGame({
		onProgress: function (current, total) {
			if (total > 0) godotShare = current / total;
			show();
		},
	}).then(function () { status.remove(); }, fail);
})();
</script>
